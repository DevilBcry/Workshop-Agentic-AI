<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — Workshop Agentic AI</title><style>body{margin:0;background:#f5f7fb;font-family:system-ui,sans-serif;color:#172033}.wrap{max-width:850px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls>*{padding:10px;border:1px solid #ccd3e0;border-radius:8px;background:white}.chat{min-height:55vh;background:white;border-radius:14px;padding:16px;box-shadow:0 5px 25px #17203312}.bubble{max-width:75%;padding:11px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap}.user{margin-left:auto;background:#3858d6;color:white}.assistant{background:#edf0f7}.composer{display:flex;gap:8px;margin-top:14px}.composer input{flex:1;padding:13px;border:1px solid #ccd3e0;border-radius:8px}.composer button{padding:0 20px;border:0;border-radius:8px;background:#3858d6;color:white;font-weight:600}small{color:#657087}</style></head>
