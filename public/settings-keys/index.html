<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่า Key — Workshop Agentic AI</title><style>body{margin:0;background:#f5f7fb;font-family:system-ui,sans-serif;color:#172033}.wrap{max-width:850px;margin:auto;padding:24px}.panel{background:#fff;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 5px 25px #17203312}.row{display:grid;grid-template-columns:150px 1fr auto auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #e5e8ef}.row:last-child{border:0}input{padding:10px;border:1px solid #ccd3e0;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#3858d6;color:#fff;cursor:pointer}button.danger{background:#a83248}.muted{color:#657087}.hidden{display:none}.status{padding:10px;border-radius:8px;background:#edf0f7;margin:10px 0}@media(max-width:700px){.row{grid-template-columns:1fr}.row button{width:100%}}</style></head>
<body><main class="wrap"><a href="/">กลับหน้าแรก</a><h1>🔑 ตั้งค่า Key & Gateway</h1><div class="panel" id="login"><h2>Admin token</h2><p class="muted">Token จะถูกเก็บใน localStorage ของเบราว์เซอร์นี้</p><input id="token" type="password" placeholder="X-Admin-Token"><button id="unlock">ปลดล็อก</button><p id="loginStatus"></p></div><div class="panel hidden" id="settings"><div id="status" class="status"></div><div class="row"><strong>Gemini API key</strong><input id="key-gemini" type="password" placeholder="ใส่ key ใหม่"><span id="state-gemini"></span><span><button data-provider="gemini">บันทึก</button> <button class="danger" data-clear="gemini">ล้าง</button></span></div><div class="row"><strong>OpenAI API key</strong><input id="key-openai" type="password" placeholder="ใส่ key ใหม่"><span id="state-openai"></span><span><button data-provider="openai">บันทึก</button> <button class="danger" data-clear="openai">ล้าง</button></span></div><div class="row"><strong>Custom gateway key</strong><input id="key-openai-compat" type="password" placeholder="ใส่ key ใหม่"><span id="state-openai-compat"></span><span><button data-provider="openai-compat">บันทึก</button> <button class="danger" data-clear="openai-compat">ล้าง</button></span></div><div class="row"><strong>Custom gateway URL</strong><input id="base-url" placeholder="https://gateway.example/v1"><span id="state-base"></span><span><button id="save-base">บันทึก</button> <button class="danger" id="clear-base">ล้าง</button></span></div></div></main><script src="/shared/admin-auth.js"></script><script src="/settings-keys/app.js"></script></body></html>
